[help]
url = "https://github.com/lunatic-lorry/ll-desktop-cli"
columns = ["options", "env", "type", "default", "description"]

[parse]
stop_at_first_positional = false
allow_unknown = false

[env]
ignore = ["LL_DESKTOP_TOKEN_FILE"]

[commands.status]
help = "Show Lunatic Lorry local daemon status."

[commands.deploy]
help = "Deploy one immutable Lunatic WebAssembly module to the local daemon."

[commands.deploy.flags.tenant]
env = "LL_DESKTOP_TENANT_ID"
aliases = ["tenant"]
type = "string"
help = "Tenant id."

[commands.deploy.flags.deployment]
env = "LL_DESKTOP_DEPLOYMENT_ID"
aliases = ["deployment"]
type = "string"
help = "Immutable deployment/generation id."

[commands.deploy.flags.module]
env = "LL_DESKTOP_MODULE"
aliases = ["module"]
type = "string"
help = "Path to the wasm32-wasip1 module."

[commands.deploy.flags.ores-adapter]
env = "LL_DESKTOP_ORES_ADAPTER"
aliases = ["ores-adapter"]
type = "string"
help = "Optional ores.lambda.adapter/v1 JSON manifest to verify at deployment admission."

[commands.deploy.flags.ores-receipt]
env = "LL_DESKTOP_ORES_RECEIPT"
aliases = ["ores-receipt"]
type = "string"
help = "Optional ores.lambda.wasm-artifact.receipt/v1 file; when supplied, bind the uploaded module and adapter bytes to the ORES build receipt before daemon mutation."

[commands.invoke]
help = "Invoke one fresh Lunatic WASM actor through the local daemon."

[commands.invoke.flags.tenant]
env = "LL_DESKTOP_TENANT_ID"
aliases = ["tenant"]
type = "string"
help = "Tenant id."

[commands.invoke.flags.deployment]
env = "LL_DESKTOP_DEPLOYMENT_ID"
aliases = ["deployment"]
type = "string"
help = "Immutable deployment/generation id."

[commands.invoke.flags.payload]
env = "LL_DESKTOP_PAYLOAD"
aliases = ["payload"]
type = "json"
default = "{}"
help = "JSON invocation payload."

[flags.url]
env = "LL_DESKTOP_DAEMON_URL"
aliases = ["url"]
type = "string"
default = "http://127.0.0.1:8763"
help = "Loopback URL of ll-desktop-daemon."

[flags.timeout]
env = "LL_DESKTOP_TIMEOUT_MS"
aliases = ["timeout"]
type = "integer"
default = 30000
help = "Invocation timeout in milliseconds."
