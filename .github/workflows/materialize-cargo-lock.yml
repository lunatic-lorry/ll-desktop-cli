name: materialize-cargo-lock

on:
  push:
    branches:
      - hardening/pin-cargo-lock-20260930

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Install declared MSRV
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy

      - name: Generate reproducible lockfile
        shell: bash
        run: cargo +1.90.0 generate-lockfile

      - name: Enforce locked CI
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/cargo \+1\.90\.0 clippy --all-targets/cargo +1.90.0 clippy --locked --all-targets/g; s/cargo \+1\.90\.0 test --all-targets/cargo +1.90.0 test --locked --all-targets/g' .github/workflows/ci.yml
          grep -F 'cargo +1.90.0 clippy --locked --all-targets -- -D warnings' .github/workflows/ci.yml
          grep -F 'cargo +1.90.0 test --locked --all-targets' .github/workflows/ci.yml

      - name: Prove exact locked graph on MSRV
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 fmt --all -- --check
          cargo +1.90.0 check --locked --all-targets
          cargo +1.90.0 test --locked --all-targets
          cargo +1.90.0 clippy --locked --all-targets -- -D warnings

      - name: Commit source-only result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-cargo-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/ci.yml
          git commit -m 'hardening: pin CLI dependency graph and enforce locked CI'
          git push origin HEAD:hardening/pin-cargo-lock-20260930

# Triggered after workflow registration so the branch push is evaluated by Actions.
